name: validate-commit
run-name: ${{ github.actor }} commit
on:
  push:
    branches-ignore:
      - main
jobs:
  build-and-validate-commit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        # Use legacy-peer-deps to allow React 19 alongside packages with older peer ranges
        run: npm ci --legacy-peer-deps
      - run: npm t
